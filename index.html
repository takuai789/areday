<script>
const APP_VERSION = "2.24.0";
const STORE_KEY = "elapsed_tracker_tasks_v1";
let tasks = [];
let adding = false;
let addKind = "repeat";        // 追加フォーム：repeat=替えどき・記録 / deadline=期限もの
let dlEditFor = null;
let seasonEditFor = null;      // 使う時期の編集中          // 期限の編集中
let dlRenewFor = null;         // 「更新した」の入力中
let editIntervalFor = null;
let planEditFor = null;      // 次の予定を編集中の項目
let planKindDraft = "tentative";
let editNameFor = null;
let activeTab = "tracked"; // "tracked" or "simple"
let openId = null; // 一覧で開いている項目（詳細カードを出す）
// 「今やるもの」だけ表示（過ぎた＋3日以内）。この端末だけの表示設定
const FOCUS_KEY = "elapsed_tracker_focus_v1";
let focusMode = false;
try { focusMode = localStorage.getItem(FOCUS_KEY) === "1"; } catch (e) {}
function setFocus(v) { focusMode = v; try { localStorage.setItem(FOCUS_KEY, v ? "1" : "0"); } catch (e) {} openId = null; render(); }
function restOf(t) { const d = daysSince(lastDate(t)); return d === null ? null : t.interval - d; }

// ── 保存・読み込み ──
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) tasks = JSON.parse(raw);
  } catch (e) { tasks = []; }
  // 旧データに updatedAt / deleted を補完
  for (const t of tasks) {
    if (typeof t.updatedAt !== "number") t.updatedAt = 0;
    if (typeof t.deleted !== "boolean") t.deleted = false;
  }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(tasks)); }
  catch (e) { notify("保存に失敗しました: " + e.message); }
  if (typeof cloudSchedule === "function") cloudSchedule();
}
// タスクの更新時刻を打刻
function touch(task) { if (task) task.updatedAt = Date.now(); }

// ── ダイアログ（confirm / alert の代わり） ──
function dialog(msg, okLabel, cancelLabel) {
  return new Promise((resolve) => {
    closeModal();
    const root = document.createElement("div");
    root.id = "modalRoot"; root.className = "overlay";
    root.innerHTML = '<div class="modal"><div class="dlg-msg"></div><div class="dlg-btns">' +
      (cancelLabel ? '<button class="ghost" data-a="0"></button>' : '') + '<button class="primary" data-a="1"></button></div></div>';
    root.querySelector(".dlg-msg").textContent = msg;
    root.querySelector('[data-a="1"]').textContent = okLabel || "OK";
    if (cancelLabel) root.querySelector('[data-a="0"]').textContent = cancelLabel;
    root.onclick = (e) => {
      const b = e.target.closest("[data-a]");
      if (b || e.target === root) { root.remove(); resolve(!!(b && b.dataset.a === "1")); }
    };
    document.body.appendChild(root);
  });
}
const askConfirm = (msg, ok) => dialog(msg, ok || "OK", "キャンセル");
function askText(title, value, placeholder) {
  return new Promise((resolve) => {
    closeModal();
    const root = document.createElement("div");
    root.id = "modalRoot"; root.className = "overlay";
    root.innerHTML = '<div class="modal"><div class="dlg-title"></div><textarea class="dlg-input" rows="3"></textarea>' +
      '<div class="dlg-btns"><button class="ghost" data-a="0">キャンセル</button><button class="primary" data-a="1">保存</button></div></div>';
    root.querySelector(".dlg-title").textContent = title;
    const ta = root.querySelector(".dlg-input"); ta.value = value || ""; ta.placeholder = placeholder || "";
    const done = (ok) => { root.remove(); resolve(ok ? ta.value : null); };
    root.onclick = (e) => { const b = e.target.closest("[data-a]"); if (b) done(b.dataset.a === "1"); else if (e.target === root) done(false); };
    ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) done(true); if (e.key === "Escape") done(false); });
    document.body.appendChild(root);
    setTimeout(() => ta.focus(), 50);
  });
}
const notify = (msg) => dialog(msg, "OK");

// ── 日付ユーティリティ ──
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function daysSince(s) {
  if (!s) return null;
  const then = new Date(s + "T00:00:00");
  const n = new Date();
  const today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.floor((today - then) / 86400000);
}
function fmtDate(s) {
  const d = new Date(s + "T00:00:00");
  const w = ["日","月","火","水","木","金","土"][d.getDay()];
  return d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日 ("+w+")";
}
// 「7月23日(木)」など、年を省いた短い表記（今年以外は年も付ける）
function fmtShort(d) {
  const w = ["日","月","火","水","木","金","土"][d.getDay()];
  const yearPrefix = d.getFullYear() !== new Date().getFullYear()
    ? d.getFullYear() + "年" : "";
  return yearPrefix + (d.getMonth()+1) + "月" + d.getDate() + "日(" + w + ")";
}
// 最後にやった日 + interval 日 = 次の予定日
function dueDate(lastStr, interval) {
  const d = new Date(lastStr + "T00:00:00");
  d.setDate(d.getDate() + interval);
  return d;
}
function esc(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function lastDate(t){ return t.dates.length ? t.dates[t.dates.length-1] : null; }
// 目安日数を人に読みやすく（548日 → 約1.5年）
function ivText(n) {
  if (!n) return "";
  if (n >= 330) { const y = Math.round(n / 365.25 * 2) / 2; return "約" + y + "年"; }
  if (n >= 56) { const m = Math.round(n / 30.4375); return "約" + m + "か月"; }
  return n + "日";
}
// 次の予定（仮／予約済み）。task.plan = { date:"YYYY-MM-DD", kind:"tentative"|"booked" }
const PLAN_KIND = { tentative: "仮", booked: "予約済み" };
function daysUntil(s) { const t = new Date(todayStr() + "T00:00:00"), d = new Date(s + "T00:00:00"); return Math.round((d - t) / 86400000); }
function planGap(task) {   // 予定日が目安の日から何日ずれているか（＋＝遅め）
  const last = lastDate(task);
  if (!task.plan || !task.interval || !last) return null;
  const due = dueDate(last, task.interval);
  return Math.round((new Date(task.plan.date + "T00:00:00") - due) / 86400000);
}
// ── 季節もの（加湿器など、使う時期だけ管理する） ──
// task.seasonFrom / task.seasonTo = 1〜12月。時期の外は「お休み中」：経過日数は数えるが、替えどき・お知らせの対象から外す
function inSeason(t, d = new Date()) {
  if (!t.seasonFrom || !t.seasonTo) return true;
  const m = d.getMonth() + 1, f = t.seasonFrom, to = t.seasonTo;
  return f <= to ? (m >= f && m <= to) : (m >= f || m <= to);
}
const offSeason = (t) => !inSeason(t);
const seasonText = (t) => t.seasonFrom ? t.seasonFrom + "〜" + t.seasonTo + "月" : "";
// ── 期限もの（免許・パスポートなど決まった期限がある項目） ──
// task.deadline="YYYY-MM-DD", task.leadMonths=何か月前から手続きできるか, task.cycleYears=更新の周期（年・任意）
const isDeadline = (t) => !!t.deadline;
function addMonthsStr(s, m) {
  const d = new Date(s + "T00:00:00"); const day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + Math.round(m));
  const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, dim));
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dlOpenDate(t) { return t.leadMonths ? addMonthsStr(t.deadline, -t.leadMonths) : t.deadline; }
function dlStatus(t) {   // over=期限切れ / open=手続きの時期 / later=まだ先
  const left = daysUntil(t.deadline);
  if (left < 0) return "over";
  if (daysUntil(dlOpenDate(t)) <= 0) return "open";
  return "later";
}
function planPassed(task) { return !!(task.plan && task.plan.date < todayStr()); }

// ── タスク操作 ──
function addTask(name, interval) {
  name = name.trim();
  if (!name) return;
  const iv = parseInt(interval, 10);
  tasks.push({
    id: Date.now(), name, dates: [],
    interval: iv > 0 ? iv : null,
    memo: "", deleted: false, updatedAt: Date.now(),
  });
  activeTab = iv > 0 ? "tracked" : "simple"; // 追加先のタブを表示
  save(); adding = false; render();
}
async function removeTask(id) {
  if (!(await askConfirm("このタスクを削除しますか？\n履歴もすべて消えます。", "削除する"))) return;
  // 論理削除（同期時に相手端末からも消すため、tombstoneとして残す）
  const task = tasks.find(t => t.id === id);
  if (task) { task.deleted = true; touch(task); save(); }
  render();
}
const MAX_HISTORY = 20; // 履歴は最新この件数まで保持（v2.9.0 で 5→20）

function pushDate(task, dateStr) {
  if (!task || task.dates.includes(dateStr)) return;
  task.dates.push(dateStr);
  task.dates.sort();
  if (task.dates.length > MAX_HISTORY) {
    task.dates = task.dates.slice(task.dates.length - MAX_HISTORY);
  }
  pruneNotes(task);
  // 予定日の60日前より後の日付を記録したら、その予定は済んだものとして外す
  if (task.plan) {
    const lim = new Date(task.plan.date + "T00:00:00"); lim.setDate(lim.getDate() - 60);
    const ls = lim.getFullYear() + "-" + String(lim.getMonth()+1).padStart(2,"0") + "-" + String(lim.getDate()).padStart(2,"0");
    if (dateStr >= ls) task.plan = null;
  }
  touch(task);
  save();
}
// 消えた日付のメモは捨てる
function pruneNotes(task) {
  if (!task.notes) return;
  for (const k of Object.keys(task.notes)) if (!task.dates.includes(k) || !task.notes[k]) delete task.notes[k];
}
function noteOf(task, d) { return (task.notes && task.notes[d]) || ""; }
async function editNote(id, d, reopen) {
  const task = tasks.find(x => x.id === id);
  if (!task) return;
  const v = await askText(task.name + "　" + fmtDate(d), noteOf(task, d), "例：○○美容室・カットとカラー／今回は左だけ交換");
  if (v === null) { if (reopen) openHistory(id); return; }
  task.notes = Object.assign({}, task.notes || {});
  if (v.trim()) task.notes[d] = v.trim(); else delete task.notes[d];
  touch(task); save(); render();
  if (reopen) openHistory(id); else showToast("メモを残しました");
}
// 1. 履歴から平均の間隔
function avgInterval(task) {
  const ds = [...task.dates].sort();
  if (ds.length < 3) return null;
  const t = ds.map(d => new Date(d + "T00:00:00").getTime());
  let sum = 0;
  for (let i = 1; i < t.length; i++) sum += (t[i] - t[i-1]) / 86400000;
  return { avg: Math.max(1, Math.round(sum / (t.length - 1))), n: ds.length };
}
function avgNeedsUpdate(task, a) {
  if (!a) return false;
  if (!task.interval) return true;
  return Math.abs(a.avg - task.interval) >= Math.max(3, task.interval * 0.15);
}
function applyAvg(id) {
  const task = tasks.find(x => x.id === id);
  const a = task && avgInterval(task);
  if (!a) return;
  saveInterval(id, a.avg);
  showToast("目安を " + a.avg + "日 にしました");
}
function markToday(id) {
  pushDate(tasks.find(x => x.id === id), todayStr());
  render();
}
function markDate(id, dateStr) {
  const task = tasks.find(x => x.id === id);
  pushDate(task, dateStr);
  closeModal(); render();
  if (task) showToast(fmtShort(new Date(dateStr + "T00:00:00")) + " を記録", null, () => editNote(id, dateStr));
}
function removeDate(id, date) {
  const task = tasks.find(x => x.id === id);
  if (task) { task.dates = task.dates.filter(d => d !== date); pruneNotes(task); touch(task); save(); }
  render();
  openHistory(id);
}
function saveInterval(id, val) {
  const u = document.getElementById("ivUnit" + id);
  const mul = u ? (u.value === "y" ? 365.25 : u.value === "m" ? 30.4375 : 1) : 1;
  const iv = Math.round(parseFloat(val) * mul);
  const task = tasks.find(x => x.id === id);
  if (task) { task.interval = iv > 0 ? iv : null; touch(task); save(); }
  activeTab = iv > 0 ? "tracked" : "simple"; // 振り分け先のタブを表示
  editIntervalFor = null; render();
}
function saveMemo(id, val) {
  const task = tasks.find(x => x.id === id);
  if (task) { task.memo = val; touch(task); save(); }
}
function saveName(id, val) {
  const v = (val || "").trim();
  const task = tasks.find(x => x.id === id);
  if (task && v && task.name !== v) { task.name = v; touch(task); save(); }
  editNameFor = null; render();
}
function startEditName(id) { editNameFor = id; render(); }

// ── 同期（エクスポート／インポート＋マージ） ──
const DATA_VERSION = 1;
const SYNC_KEY = "elapsed_tracker_lastsync_v1";

function getLastSync() {
  try {
    const raw = localStorage.getItem(SYNC_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function setLastSync(kind) {
  try {
    localStorage.setItem(SYNC_KEY, JSON.stringify({ at: Date.now(), kind }));
  } catch (e) {}
}
// 「3日前」など、経過を人にわかる形で
function relTime(ts) {
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return "たった今";
  if (mins < 60) return mins + "分前";
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + "時間前";
  const days = Math.floor(hours / 24);
  if (days === 1) return "昨日";
  return days + "日前";
}
function renderSyncStatus() {
  const el = document.getElementById("syncStatus");
  if (!el) return;
  const s = getLastSync();
  if (!s) {
    el.innerHTML = '<span style="opacity:.5">まだ同期していません</span>';
    return;
  }
  const d = new Date(s.at);
  const stamp = (d.getMonth()+1)+"/"+d.getDate()+" "+
    String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  const label = s.kind === "export" ? "書き出し" : "取り込み";
  const days = Math.floor((Date.now() - s.at) / 86400000);
  const warn = days >= 3
    ? ' <span style="color:var(--warn);font-weight:700">・そろそろ同期を</span>' : '';
  el.innerHTML = '最終'+label+'：'+stamp+'（'+relTime(s.at)+'）'+warn;
}

  // ---------- バックアップ（全アプリ共通の作法） ----------
  // iPhone：共有メニュー →「"ファイル"に保存」→ iCloud Drive「アプリのバックアップ」フォルダ
  // Mac：ダウンロード。ファイル名は「アプリ名_YYYY-MM-DD.json」でそろえる。
  function bkName(app) { const d = new Date(); return `${app}_${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`; }
  // iPhoneの共有シートは、「ファイルに保存」やショートカットで保存できても「キャンセル」と返すことがある。そのときは本人に聞く。
  function bkAskSaved() {
    return new Promise((resolve) => {
      const bg = document.createElement('div');
      bg.style.cssText = 'position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;padding:24px;font-family:inherit';
      bg.innerHTML = '<div style="width:100%;max-width:330px;background:#fff;color:#1c1c1e;border-radius:18px;padding:20px 20px 12px;box-shadow:0 12px 40px rgba(0,0,0,.2)">' +
        '<div style="font-size:16px;font-weight:700;margin-bottom:6px">バックアップは保存できましたか？</div>' +
        '<div style="font-size:14px;line-height:1.6;color:#6e6e73">保存できていれば、バックアップのお知らせを消します。</div>' +
        '<div style="display:flex;justify-content:flex-end;gap:4px;margin-top:12px">' +
        '<button data-v="0" style="border:0;background:none;font:inherit;font-size:15px;padding:10px 12px;color:#6e6e73">やめた</button>' +
        '<button data-v="1" style="border:0;background:none;font:inherit;font-size:15px;font-weight:700;padding:10px 12px;color:#007aff">保存できた</button></div></div>';
      bg.addEventListener('click', (e) => { const b = e.target.closest('button[data-v]'); if (!b) return; bg.remove(); resolve(b.dataset.v === '1'); });
      document.body.appendChild(bg);
    });
  }
  async function bkSave(app, text) { // 戻り値 'ok' | 'cancel'
    const name = bkName(app);
    if (navigator.maxTouchPoints > 0) {
      try {
        const file = new File([text], name, { type: 'application/json' });
        if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return 'ok'; }
      } catch (e) { if (e && e.name === 'AbortError') return (await bkAskSaved()) ? 'ok' : 'cancel'; }
    }
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    return 'ok';
  }
async function exportData() {
  const payload = {
    app: "areday",
    dataVersion: DATA_VERSION,
    exportedAt: new Date().toISOString(),
    tasks,
  };
  if (await bkSave("あれから何日", JSON.stringify(payload, null, 2)) !== "ok") return;
  setLastSync("export");
  renderSyncStatus();
}

function importDataFromFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    let payload;
    try { payload = JSON.parse(e.target.result); }
    catch (err) { notify("ファイルを読み込めませんでした：JSONとして解析できません"); return; }
    if (!payload || payload.app !== "areday" || !Array.isArray(payload.tasks)) {
      notify("このアプリのデータではないようです");
      return;
    }
    const result = mergeAndApply(payload.tasks);
    setLastSync("import");
    renderSyncStatus();
    notify(
      "同期しました。\n" +
      "・新しく追加：" + result.added + "件\n" +
      "・更新：" + result.updated + "件\n" +
      "・変更なし：" + result.same + "件" +
      (result.deletedSynced ? "\n・削除を反映：" + result.deletedSynced + "件" : "")
    );
  };
  reader.onerror = () => notify("ファイルの読み込みに失敗しました");
  reader.readAsText(file);
}

// 取り込んだタスク群をローカルとマージし、結果を tasks に反映
function mergeAndApply(incoming, lww) {
  const byId = new Map();
  for (const t of tasks) byId.set(t.id, t);

  let added = 0, updated = 0, same = 0, deletedSynced = 0;

  for (const imp of incoming) {
    // 互換のため初期値補完
    if (typeof imp.updatedAt !== "number") imp.updatedAt = 0;
    if (typeof imp.deleted !== "boolean") imp.deleted = false;
    if (!Array.isArray(imp.dates)) imp.dates = [];

    const cur = byId.get(imp.id);
    if (!cur) {
      // ローカルにない → そのまま追加（削除済みも含む）
      byId.set(imp.id, imp);
      if (imp.deleted) deletedSynced++; else added++;
      continue;
    }

    // 履歴は和集合（順序ソート、最新MAX_HISTORY件）
    const winner0 = (imp.updatedAt || 0) >= (cur.updatedAt || 0) ? imp : cur;
    // 自動共有では「新しく更新した方」の履歴をそのまま採用（消した日付が戻らないように）。ファイル取り込みは和集合
    const set = new Set(lww ? (winner0.dates || []) : [...(cur.dates||[]), ...(imp.dates||[])]);
    let dates = [...set].sort();
    if (dates.length > MAX_HISTORY) dates = dates.slice(dates.length - MAX_HISTORY);

    // updatedAt の新しい方を採用（属性とdeletedの判定）
    const winner = (imp.updatedAt || 0) >= (cur.updatedAt || 0) ? imp : cur;
    const loser = winner === imp ? cur : imp;
    const notes = Object.assign({}, loser.notes || {}, winner.notes || {});
    for (const k of Object.keys(notes)) if (!dates.includes(k) || !notes[k]) delete notes[k];
    const merged = {
      id: cur.id,
      name: winner.name,
      interval: winner.interval ?? null,
      memo: winner.memo || "",
      dates,
      notes,
      deleted: winner.deleted === true,
      archived: winner.archived === true,
      archivedAt: winner.archivedAt || "",
      stopNote: winner.stopNote || "",
      deadline: winner.deadline || "",
      seasonFrom: winner.seasonFrom || 0,
      seasonTo: winner.seasonTo || 0,
      leadMonths: winner.leadMonths || 0,
      cycleYears: winner.cycleYears || 0,
      plan: winner.plan && winner.plan.date ? { date: winner.plan.date, kind: winner.plan.kind === "booked" ? "booked" : "tentative" } : null,
      updatedAt: Math.max(cur.updatedAt || 0, imp.updatedAt || 0),
    };

    // 差分判定（同一かどうか・変更内容）
    const samePayload =
      cur.name === merged.name &&
      (cur.interval ?? null) === (merged.interval ?? null) &&
      (cur.memo || "") === merged.memo &&
      cur.deleted === merged.deleted &&
      (cur.archived === true) === merged.archived &&
      (cur.stopNote || "") === merged.stopNote &&
      JSON.stringify(cur.plan || null) === JSON.stringify(merged.plan) &&
      (cur.deadline || "") === merged.deadline && (cur.seasonFrom || 0) === merged.seasonFrom && (cur.seasonTo || 0) === merged.seasonTo && (cur.leadMonths || 0) === merged.leadMonths && (cur.cycleYears || 0) === merged.cycleYears &&
      JSON.stringify(cur.dates || []) === JSON.stringify(merged.dates) &&
      JSON.stringify(cur.notes || {}) === JSON.stringify(merged.notes);
    if (samePayload) same++;
    else if (!cur.deleted && merged.deleted) deletedSynced++;
    else updated++;

    byId.set(imp.id, merged);
  }

  tasks = [...byId.values()];
  save();
  render();
  return { added, updated, same, deletedSynced };
}

function pickImportFile() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.onchange = () => { if (input.files && input.files[0]) importDataFromFile(input.files[0]); };
  input.click();
}

// ── 描画 ──
function statusOf(task, days) {
  if (!task.interval || days === null) return { status:"none", ratio:0 };
  const ratio = days / task.interval;
  let status = "ok";
  if (days >= task.interval) status = "over";
  else if (ratio >= 0.8) status = "soon";
  return { status, ratio };
}

function buildCard(task, i) {

    const last = lastDate(task);
    const days = daysSince(last);
    const off = offSeason(task);   // 季節外は替えどきの判定をしない
    const { status, ratio } = off ? { status: "none", ratio: 0 } : statusOf(task, days);
    const remaining = (task.interval && days !== null) ? task.interval - days : null;
    const numColor = status === "over" ? "var(--over)" : status === "soon" ? "#c27a1e" : "var(--accent)";
    const barColor = status === "over" ? "var(--over)" : status === "soon" ? "var(--warn)" : "var(--accent)";

    const card = document.createElement("div");
    card.className = "card" + (status === "over" ? " over" : status === "soon" ? " soon" : "");
    card.style.animationDelay = (i * 60) + "ms";

    // ── 表示部の組み立て ──
    // (1) 目安あり × 記録あり → 案C（時間軸＋過去/未来の2つの数字）
    // (2) それ以外 → 従来レイアウト（大きい数字1つ）
    let displayHtml;
    if (task.interval && days !== null && !off) {
      const due = dueDate(last, task.interval);

            '<div class="due-marker" style="left:'+markerPos+'%;border-color:'+barColor+'"></div>' +
          '</div>' +
          '<div class="due-ends">' +
            '<div>' +

        'onchange="saveMemo('+task.id+',this.value)" ' +
        'oninput="this.title=this.value;this.classList.toggle(\'has-memo\',!!this.value)">' +
        esc(task.memo || "") + '</textarea>';
    return card;
}

// ── 使う時期（季節もの）の設定 ──

function saveSeason(id) {
  const t = tasks.find(x => x.id === id); if (!t) return;

function clearSeason(id) {

  t.seasonFrom = 0; t.seasonTo = 0; touch(t); save(); seasonEditFor = null; render();
}
// ── 次の予定（仮／予約済み） ──
function planHtml(task) {
  if (planEditFor === task.id) {
    const v = task.plan ? task.plan.date : "";
    return '<div class="plan-edit">' +
      '<div class="plan-edit-hd">次の予定</div>' +
      '<input type="date" class="date-input" id="planDate'+task.id+'" value="'+v+'">' +
      '<div class="plan-kind">' + Object.keys(PLAN_KIND).map(k => '<button type="button" class="'+(planKindDraft===k?'on':'')+'" onclick="planKindDraft=\''+k+'\';render()">'+PLAN_KIND[k]+'</button>').join('') + '</div>' +
      '<div class="plan-btns"><button class="primary" onclick="savePlan('+task.id+')">保存</button>' +
      (task.plan ? '<button class="ghost" onclick="clearPlan('+task.id+')">予定を消す</button>' : '') +
      '<button class="cancel" onclick="planEditFor=null;render()">✕</button></div></div>';
  }
  if (!task.plan) return '<button class="set-plan-link" onclick="startEditPlan('+task.id+')">＋ 次の予定を入れる（仮でもOK）</button>';
  const p = task.plan, du = daysUntil(p.date), gap = planGap(task);
  const when = du < 0 ? '<span class="plan-past">'+(-du)+'日過ぎ</span>' : du === 0 ? '<span class="plan-when">今日</span>' : '<span class="plan-when">あと'+du+'日</span>';
  const gapTxt = gap === null ? "" : Math.abs(gap) <= 3 ? "目安どおり" : "目安より" + Math.abs(gap) + "日" + (gap > 0 ? "遅め" : "早め");
  return '<div class="plan-box '+p.kind+(du < 0 ? ' passed' : '')+'" onclick="startEditPlan('+task.id+')">' +
    '<div class="plan-l">次の予定</div>' +
    '<div class="plan-main"><b>'+fmtDate(p.date)+'</b><span class="plan-tag">'+PLAN_KIND[p.kind]+'</span>'+when+'</div>' +
    (gapTxt ? '<div class="plan-gap">'+gapTxt+'</div>' : '') +
    (du < 0 ? '<div class="plan-ask" onclick="event.stopPropagation()">予定日を過ぎました。やった？ <button class="primary" onclick="planDone('+task.id+')">やった（'+fmtShort(new Date(p.date+"T00:00:00"))+'で記録）</button><button class="ghost" onclick="openPicker('+task.id+')">別の日にやった</button><button class="ghost" onclick="startEditPlan('+task.id+')">延期する</button></div>' : '') +
    '</div>';
}
function startEditPlan(id) {
  const t = tasks.find(x => x.id === id); if (!t) return;
  planEditFor = id; planKindDraft = t.plan ? t.plan.kind : "tentative";
  if (!t.plan) {
    // まだ予定がなければ、目安の日（なければ1か月後）を初期値に
    setTimeout(() => { const el = document.getElementById("planDate" + id); if (el && !el.value) { const last = lastDate(t); const d = t.interval && last ? dueDate(last, t.interval) : new Date(Date.now() + 30 * 86400000); el.value = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); } }, 0);
  }
  activeTab = isDeadline(t) ? "deadline" : t.interval ? "tracked" : "simple"; focusMode = false;
  openId = id; render();
}
function savePlan(id) {
  const t = tasks.find(x => x.id === id); const el = document.getElementById("planDate" + id);
  if (!t || !el) return;
  if (!el.value) { showToast("日付を選んでください"); return; }
  t.plan = { date: el.value, kind: planKindDraft === "booked" ? "booked" : "tentative" };
  touch(t); save(); planEditFor = null; render();
  showToast("次の予定を " + fmtShort(new Date(el.value + "T00:00:00")) + "（" + PLAN_KIND[t.plan.kind] + "）にしました");
}
function clearPlan(id) {
  const t = tasks.find(x => x.id === id); if (!t) return;
  t.plan = null; touch(t); save(); planEditFor = null; render();
}
function planDone(id) {
  const t = tasks.find(x => x.id === id); if (!t || !t.plan) return;
  const d = t.plan.date;
  pushDate(t, d); t.plan = null; touch(t); save(); render();
  showToast(fmtShort(new Date(d + "T00:00:00")) + " を記録", null, () => editNote(id, d));
}

// 替えどき(目安)が近い順: 残り日数の少ない順。未記録は末尾。
// 過ぎ具合：目安に対してどれだけ過ぎたか（100日ごとの3日超過と、3日ごとの3日超過は別物）
function overLevel(task, days) {
  const ratio = days / task.interval;
  const lv = ratio < 1.25 ? 1 : ratio < 2 ? 2 : 3;
  return { lv, ratio, pct: Math.round(ratio * 100), label: ["", "少し過ぎ", "だいぶ過ぎ", "かなり過ぎ"][lv] };
}
// まず「過ぎた → もうすぐ → まだ大丈夫 → 未記録」のまとまり順、その中で残り日数の少ない順
const STATUS_RANK = { over: 0, soon: 1, ok: 2, none: 3 };
function sortByDue(a, b) {
  const da = daysSince(lastDate(a)), db = daysSince(lastDate(b));
  const ga = da === null ? 3 : STATUS_RANK[statusOf(a, da).status];
  const gb = db === null ? 3 : STATUS_RANK[statusOf(b, db).status];
  if (ga !== gb) return ga - gb;
  if (ga === 0) return (db / b.interval) - (da / a.interval); // 過ぎたものは、目安に対して過ぎている割合が大きい順
  const eff = (t, d) => t.plan ? daysUntil(t.plan.date) : (d === null ? Infinity : t.interval - d);
  return eff(a, da) - eff(b, db);
}
// 経過日数が多い順(ずっとやってない順)。未記録は末尾。
function sortByElapsed(a, b) {
  const da = daysSince(lastDate(a)), db = daysSince(lastDate(b));
  if (da === null && db === null) return 0;
  if (da === null) return 1;
  if (db === null) return -1;
  return db - da;
}

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const visible = tasks.filter(t => !t.deleted);
  if (visible.length === 0 && !adding) {
    grid.innerHTML = '<div class="empty">まだ何も登録されていません。<br>下のボタンから追加するか、<a href="guide.html" style="color:var(--accent);font-weight:700">使い道ガイド</a>の例から選べます。</div>';
    renderAddArea();
    return;
  }

  const active = visible.filter(t => !t.archived);
  const seasonLast = (arr) => arr.filter(t => !offSeason(t)).concat(arr.filter(offSeason));
  const tracked = seasonLast(active.filter(t => t.interval && !isDeadline(t)).sort(sortByDue));
  const simple = seasonLast(active.filter(t => !t.interval && !isDeadline(t)).sort(sortByElapsed));
  const dlList = active.filter(isDeadline).sort((a, b) => a.deadline.localeCompare(b.deadline));
  const dlAlert = dlList.filter(t => dlStatus(t) !== "later").length;
  const stopped = visible.filter(t => t.archived).sort((a, b) => String(b.archivedAt || "").localeCompare(String(a.archivedAt || "")));

  // 手続きの時期に入った期限もの（予約がまだのもの）
  const dlDue = active.filter(t => isDeadline(t) && dlStatus(t) !== "later" && !t.plan);
  if (dlDue.length && activeTab !== "deadline") {
    const box = document.createElement("div");
    box.className = "dl-alert";
    box.innerHTML = '<div class="pa-hd">そろそろ手続きの時期</div>' + dlDue.map(t => '<div class="pa-row" data-dl="' + t.id + '"><div class="pa-t"><b></b><span>期限 ' + ymdJ(t.deadline) + (daysUntil(t.deadline) < 0 ? '（期限切れ）' : '（あと' + daysUntil(t.deadline) + '日）') + '</span></div><span class="dl-go">›</span></div>').join('');
    dlDue.forEach((t, i) => { box.querySelectorAll(".pa-t b")[i].textContent = t.name; });
    box.onclick = (e) => { const r = e.target.closest("[data-dl]"); if (r) { activeTab = "deadline"; openId = +r.dataset.dl; render(); } };
    grid.appendChild(box);
  }
  // 予定日を過ぎたもの：「やった？」と聞く
  const passed = active.filter(planPassed);
  if (passed.length) {
    const box = document.createElement("div");
    box.className = "plan-alert";
    box.innerHTML = '<div class="pa-hd">予定日を過ぎたもの — やった？</div>' + passed.map(t =>
      '<div class="pa-row"><div class="pa-t"><b></b><span>' + fmtShort(new Date(t.plan.date + "T00:00:00")) + '（' + PLAN_KIND[t.plan.kind] + '）</span></div>' +
      '<div class="pa-b"><button class="primary" data-pd="' + t.id + '">やった</button><button class="ghost" data-pe="' + t.id + '">延期</button></div></div>').join('');
    passed.forEach((t, i) => { box.querySelectorAll(".pa-t b")[i].textContent = t.name; });
    box.onclick = (e) => { const d = e.target.closest("[data-pd]"), p = e.target.closest("[data-pe]"); if (d) planDone(+d.dataset.pd); if (p) startEditPlan(+p.dataset.pe); };
    grid.appendChild(box);
  }
  // タブバー
  const tabbar = document.createElement("div");
  tabbar.className = "tabbar";
  // 替えどき超過（またはもうすぐ）の件数
  const overCount = tracked.filter(t => {
    if (offSeason(t)) return false;
    const d = daysSince(lastDate(t));
    return d !== null && d >= t.interval;
  }).length;
  const soonCount = tracked.filter(t => {
    if (offSeason(t)) return false;
    const d = daysSince(lastDate(t));
    return d !== null && d < t.interval && d / t.interval >= 0.8;
  }).length;

  let alertBadge = "";
  if (overCount > 0) alertBadge = '<span class="tab-alert over">⚠ '+overCount+'</span>';
  else if (soonCount > 0) alertBadge = '<span class="tab-alert soon">'+soonCount+'</span>';

  tabbar.innerHTML =
    '<button class="tab'+(activeTab==="tracked"?" active":"")+'" onclick="switchTab(\'tracked\')">' +
      '替えどき管理 <span class="tab-count">'+tracked.length+'</span>'+alertBadge+'</button>' +
    '<button class="tab'+(activeTab==="simple"?" active":"")+'" onclick="switchTab(\'simple\')">' +
      '記録だけ <span class="tab-count">'+simple.length+'</span></button>' +
    '<button class="tab'+(activeTab==="deadline"?" active":"")+'" onclick="switchTab(\'deadline\')">' +
      '期限 <span class="tab-count">'+dlList.length+'</span>'+(dlAlert ? '<span class="tab-alert soon">'+dlAlert+'</span>' : '')+'</button>' +
    '<button class="tab'+(activeTab==="stopped"?" active":"")+'" onclick="switchTab(\'stopped\')">' +
      'やめた <span class="tab-count">'+stopped.length+'</span></button>';
  grid.appendChild(tabbar);

  // やめた習慣：ログとして眺める・再開する
  if (activeTab === "stopped") {
    if (!stopped.length) {
      const e = document.createElement("div");
      e.className = "empty";
      e.innerHTML = "やめた習慣はまだありません。<br>項目を開いて「やめる」を押すと、記録を残したままここに移ります。";
      grid.appendChild(e);
    } else {
      const note = document.createElement("div");
      note.className = "sort-note";
      note.textContent = "やめた順（新しい順）・行をタップで記録を見る";
      grid.appendChild(note);
      const sub = document.createElement("div");
      sub.className = "tlist";
      stopped.forEach(t => sub.appendChild(buildStoppedRow(t)));
      grid.appendChild(sub);
    }
    renderAddArea();
    return;
  }

  // 期限もの：期限切れ → 手続きの時期 → まだ先
  if (activeTab === "deadline") {
    if (!dlList.length) {
      const e = document.createElement("div");
      e.className = "empty";
      e.innerHTML = "期限があることはまだありません。<br>運転免許・パスポート・保険の更新などを「＋ やることを追加」→「期限があること」で入れると、手続きできる時期を教えます。";
      grid.appendChild(e);
    } else {
      const sub = document.createElement("div");
      sub.className = "tlist";
      let lastG = null;
      dlList.forEach(task => {
        const g = dlStatus(task);
        if (g !== lastG) {
          const cnt = dlList.filter(t => dlStatus(t) === g).length;
          const h = document.createElement("div");
          h.className = "grp g-" + (g === "over" ? "over" : g === "open" ? "soon" : "ok");
          h.innerHTML = { over: "期限切れ", open: "手続きの時期", later: "まだ先" }[g] + ' <span class="n">' + cnt + '</span>';
          sub.appendChild(h); lastG = g;
        }
        if (openId === task.id) {
          const wrap = document.createElement("div");
          wrap.className = "ti-open";
          wrap.appendChild(buildCard(task, 0));
          const c = document.createElement("button");
          c.className = "ti-close"; c.textContent = "▲ とじる";
          c.onclick = () => { openId = null; render(); };
          wrap.appendChild(c);
          sub.appendChild(wrap);
        } else sub.appendChild(buildDlRow(task));
      });
      grid.appendChild(sub);
    }
    renderAddArea();
    return;
  }

  const focusList = tracked.filter(t => { if (offSeason(t)) return false; const r = restOf(t); return r !== null && r <= 3; })
    .sort((a, b) => { const ra = restOf(a), rb = restOf(b);
      if ((ra < 0) !== (rb < 0)) return ra < 0 ? -1 : 1;
      return ra < 0 ? sortByDue(a, b) : ra - rb; });
  const list = activeTab === "tracked" ? (focusMode ? focusList : tracked) : simple;
  if (activeTab === "tracked" && tracked.length) {
    const bar = document.createElement("div");
    bar.className = "fbar";
    bar.innerHTML = '<button class="fchip' + (focusMode ? '' : ' on') + '" data-f="0">すべて <span>' + tracked.length + '</span></button>' +
      '<button class="fchip' + (focusMode ? ' on' : '') + '" data-f="1">今やるもの <span>' + focusList.length + '</span></button>' +
      '<span class="fhint">過ぎたもの＋3日以内</span>';
    bar.onclick = (e) => { const b = e.target.closest(".fchip"); if (b) setFocus(b.dataset.f === "1"); };
    grid.appendChild(bar);
  }
  const desc = activeTab === "tracked" ? "目安が近い順" : "ずっとやってない順";

  if (list.length === 0 && activeTab === "tracked" && focusMode && tracked.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = "いま替えどきのものはありません。<br>3日以内に来るものもなし。";
    grid.appendChild(e);
  } else if (list.length === 0) {
    const emptyMsg = activeTab === "tracked"
      ? "替えどきを管理するタスクはまだありません。<br>タスクに目安日数を設定すると、ここに表示されます。"
      : "記録だけのタスクはまだありません。";
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = emptyMsg;
    grid.appendChild(e);
  } else {
    if (activeTab !== "tracked") {
      const note = document.createElement("div");
      note.className = "sort-note";
      note.textContent = desc;
      grid.appendChild(note);
    }

    const sub = document.createElement("div");
    sub.className = "tlist";
    let lastGrp = null;
    list.forEach(task => {
      const d = daysSince(lastDate(task));
      const { status } = offSeason(task) ? { status: "none" } : statusOf(task, d);
      if (activeTab === "simple" && offSeason(task) && lastGrp !== "off") {
        const cnt = list.filter(offSeason).length;
        const h = document.createElement("div");
        h.className = "grp g-off"; h.innerHTML = '季節外（お休み中） <span class="n">' + cnt + '</span>';
        sub.appendChild(h); lastGrp = "off";
      }
      if (activeTab === "tracked") {
        const grpOf = (t) => { if (offSeason(t)) return "off"; const dd = daysSince(lastDate(t)); if (dd === null) return "never"; const st = statusOf(t, dd).status; return focusMode ? (st === "over" ? "over" : "due3") : st; };
        const g = grpOf(task);
        if (g !== lastGrp) {
          const cnt = list.filter(t => grpOf(t) === g).length;
          const label = { over: "替えどきを過ぎた", soon: "もうすぐ", ok: "まだ大丈夫", never: "まだ記録なし", due3: "3日以内", off: "季節外（お休み中）" }[g];
          const h = document.createElement("div");

        }
      }
      if (openId === task.id) {
        const wrap = document.createElement("div");
        wrap.className = "ti-open";
        wrap.appendChild(buildCard(task, 0));
        const c = document.createElement("button");
        c.className = "ti-close"; c.textContent = "▲ とじる";
        c.onclick = () => { openId = null; render(); };
        wrap.appendChild(c);
        sub.appendChild(wrap);
      } else {
        sub.appendChild(buildRow(task, d, status));
      }
    });
    grid.appendChild(sub);
  }

  renderAddArea();

  // 編集中のタスク名入力にフォーカス
  if (editNameFor !== null) {
    const el = document.getElementById("nameInput" + editNameFor);
    if (el) { el.focus(); el.select(); }
  }
}

// ── 期限ものの行と詳細カード ──
function ymdJ(s) { const [y, m, d] = s.split("-").map(Number); return (y !== new Date().getFullYear() ? y + "/" : "") + m + "/" + d; }
function buildDlRow(task) {
  const row = document.createElement("div");
  const st = dlStatus(task), left = daysUntil(task.deadline), open = dlOpenDate(task);
  row.className = "ti dl " + (st === "over" ? "over lv2" : st === "open" ? "soon" : "");
  let sub = "期限 " + ymdJ(task.deadline);
  if (task.leadMonths) sub += " ・ 手続き " + ymdJ(open) + "〜";
  if (task.memo) sub += " ・ " + task.memo.split("\n")[0];
  const planChip = task.plan ? '<span class="ti-plan ' + task.plan.kind + (planPassed(task) ? ' passed' : '') + '">' + (planPassed(task) ? "予定 " + ymdJ(task.plan.date) + " を過ぎた" : "予定 " + ymdJ(task.plan.date) + "（" + PLAN_KIND[task.plan.kind] + "）") + '</span>' : '';
  const hint = st === "open" ? '<span class="ti-plan dl-open">手続きできます</span>' : st === "later" && task.leadMonths ? '<div class="dl-hint">手続きまで あと' + daysUntil(open) + '日</div>' : '';
  const num = left < 0
    ? '<span class="l">期限切れ</span><span class="n">' + (-left) + '</span><span class="u">日</span>'
    : '<span class="l">期限まで</span><span class="n">' + left + '</span><span class="u">日</span>';
  row.innerHTML = '<div class="ti-main"><div class="ti-name"></div><div class="ti-sub"></div>' + hint + planChip + '</div><div class="ti-num">' + num + '</div>';
  row.querySelector(".ti-name").textContent = task.name;
  row.querySelector(".ti-sub").textContent = sub;
  row.onclick = () => { openId = task.id; dlEditFor = null; dlRenewFor = null; editNameFor = null; render(); };
  return row;
}
function buildDlCard(task) {
  const card = document.createElement("div");
  const st = dlStatus(task), left = daysUntil(task.deadline), open = dlOpenDate(task);
  card.className = "card dlcard" + (st === "over" ? " over" : st === "open" ? " soon" : "");
  const nameHtml = editNameFor === task.id
    ? '<input class="name-input" id="nameInput'+task.id+'" type="text" value="'+esc(task.name)+'" onblur="saveName('+task.id+',this.value)" onkeydown="if(event.key===\'Enter\')this.blur();if(event.key===\'Escape\'){editNameFor=null;render();}">'
    : '<div class="task-name editable" onclick="startEditName('+task.id+')" title="タップして編集">'+esc(task.name)+'</div>';
  const big = left < 0
    ? '<div class="dl-big over"><span>期限切れ</span><b>' + (-left) + '</b><span>日</span></div>'
    : '<div class="dl-big"><span>期限まで あと</span><b>' + left + '</b><span>日</span></div>';
  const openTxt = !task.leadMonths ? '' : st === "later"
    ? '<div class="dl-open-line">手続きできるのは <b>' + fmtDate(open) + '</b> から（あと' + daysUntil(open) + '日）</div>'
    : st === "open" ? '<div class="dl-open-line now">いま手続きできます（' + fmtDate(open) + ' から）</div>' : '';
  let editBox = "";
  if (dlEditFor === task.id) {
    editBox = '<div class="plan-edit"><div class="plan-edit-hd">期限の設定</div>' +
      '<input type="date" class="date-input" id="dlDate'+task.id+'" value="'+task.deadline+'">' +
      '<select class="unit-sel" id="dlLead'+task.id+'">' + [0,1,2,3,4,6,12].map(m => '<option value="'+m+'"'+((task.leadMonths||0)===m?' selected':'')+'>'+(m ? '手続きは' + m + 'か月前から' : '期限の日だけ')+'</option>').join('') + '</select>' +
      '<span class="unit">周期</span><input type="number" min="0" step="any" inputmode="decimal" class="num-input" id="dlCycle'+task.id+'" value="'+(task.cycleYears||"")+'" placeholder="任意" style="width:70px"><span class="unit">年</span>' +
      '<div class="plan-btns"><button class="primary" onclick="saveDl('+task.id+')">保存</button><button class="cancel" onclick="dlEditFor=null;render()">✕</button></div></div>';
  }

    const sug = task.cycleYears ? addMonthsStr(task.deadline, task.cycleYears * 12) : "";
    renewBox = '<div class="plan-edit"><div class="plan-edit-hd">更新しました — 新しい期限は？</div>' +
      '<input type="date" class="date-input" id="dlNew'+task.id+'" value="'+sug+'">' +
      (sug ? '<span class="unit">（前回と同じ ' + task.cycleYears + '年後を入れています）</span>' : '') +
      '<div class="plan-btns"><button class="primary" onclick="renewDl('+task.id+')">保存</button><button class="cancel" onclick="dlRenewFor=null;render()">✕</button></div></div>';
  }

  card.innerHTML =
    '<div class="card-top">' + nameHtml +
      '<button class="stop-btn" title="やめた習慣に移す" onclick="stopTask('+task.id+')">やめる</button>' +
      '<button class="icon-btn" title="削除" onclick="removeTask('+task.id+')">🗑</button></div>' +
    big +
    '<div class="dl-date">期限 ' + fmtDate(task.deadline) + '</div>' + openTxt +

    editBox + planHtml(task) + renewBox +

      '<button class="primary" onclick="dlRenewFor='+task.id+';dlEditFor=null;render()">✓ 更新した</button>' + historyBtn +

}
function saveDl(id) {
  const t = tasks.find(x => x.id === id); if (!t) return;
  const d = document.getElementById("dlDate" + id).value;
  if (!d) { showToast("期限の日付を選んでください"); return; }
  t.deadline = d; t.leadMonths = +document.getElementById("dlLead" + id).value || 0;
  t.cycleYears = parseFloat(document.getElementById("dlCycle" + id).value) || 0;
  touch(t); save(); dlEditFor = null; render();
}
function renewDl(id) {
  const t = tasks.find(x => x.id === id); if (!t) return;
  const d = document.getElementById("dlNew" + id).value;
  if (!d) { showToast("新しい期限を選んでください"); return; }
  // 周期が未設定なら、前の期限との差から覚えておく
  if (!t.cycleYears) { const yrs = Math.round((new Date(d) - new Date(t.deadline)) / (365.25 * 86400000) * 2) / 2; if (yrs >= 0.5) t.cycleYears = yrs; }
  const today = todayStr();
  if (!t.dates.includes(today)) { t.dates.push(today); t.dates.sort(); if (t.dates.length > MAX_HISTORY) t.dates = t.dates.slice(t.dates.length - MAX_HISTORY); }
  t.deadline = d; t.plan = null;
  touch(t); save(); dlRenewFor = null; render();
  showToast("新しい期限を " + fmtShort(new Date(d + "T00:00:00")) + " にしました");
}

function buildRow(task, days, status) {
  const row = document.createElement("div");
  if (offSeason(task)) {
    row.className = "ti off";
    const last = lastDate(task);
    const sub = (last ? "最終 " + fmtShort(new Date(last + "T00:00:00")) + " ・ " : "") + "お休み中（" + seasonText(task) + "に使う）";
    const num = days === null ? '<span class="ti-never">未記録</span>' : '<span class="l"></span><span class="n">' + days + '</span><span class="u">日前</span>';
    row.innerHTML = '<div class="ti-main"><div class="ti-name"></div><div class="ti-sub"></div></div><div class="ti-num">' + num + '</div><button class="ti-done" title="今日やった">✓</button>';
    row.querySelector(".ti-name").textContent = task.name;
    row.querySelector(".ti-sub").textContent = sub;
    row.onclick = (e) => { if (e.target.closest(".ti-done")) { quickDone(task.id); return; } openId = task.id; editIntervalFor = null; editNameFor = null; render(); };
    return row;
  }
  const ol = status === "over" && task.interval && days !== null ? overLevel(task, days) : null;
  row.className = "ti " + (ol ? "over lv" + ol.lv : status === "soon" ? "soon" : "");
  const last = lastDate(task);
  let sub = last ? "最終 " + fmtShort(new Date(last + "T00:00:00")) : "まだ記録なし";
  if (task.interval) sub += " ・ 目安 " + ivText(task.interval);
  if (task.memo) sub += " ・ " + task.memo.split("\n")[0];
  const planChip = task.plan ? '<span class="ti-plan ' + task.plan.kind + (planPassed(task) ? ' passed' : '') + '">' + (() => { const [y, m, d] = task.plan.date.split("-").map(Number); const md = (y !== new Date().getFullYear() ? y + "/" : "") + m + "/" + d; return planPassed(task) ? "予定 " + md + " を過ぎた" : "次 " + md + "（" + PLAN_KIND[task.plan.kind] + "）"; })() + '</span>' : '';
  let bar = "";
  if (task.interval && days !== null) {
    const r = Math.min(days / task.interval, 1);
    const col = status === "over" ? "var(--over)" : status === "soon" ? "var(--warn)" : "var(--accent)";
    bar = '<div class="ti-bar"><i style="width:' + (r * 100) + '%;background:' + col + '"></i></div>';
    if (ol) bar = '<div class="sev">' + [1, 2, 3].map(i => '<i class="' + (i <= ol.lv ? "on" : "") + '"></i>').join("") +
      '<span>目安の <b>' + ol.pct + '%</b></span></div>';
  }
  let num;
  if (days === null) num = '<span class="ti-never">未記録</span>';
  else if (task.interval && activeTab === "tracked") {
    const rest = task.interval - days;
    num = rest >= 0
      ? '<span class="l">あと</span><span class="n">' + rest + '</span><span class="u">日</span>'
      : '<span class="l">' + (ol ? ol.label : "超過") + '</span><span class="n">' + (-rest) + '</span><span class="u">日</span>';
  } else num = '<span class="l">' + (days === 0 ? "今日" : "") + '</span><span class="n">' + days + '</span><span class="u">日前</span>';
  row.innerHTML =
    '<div class="ti-main"><div class="ti-name"></div><div class="ti-sub"></div>' + planChip + bar + '</div>' +
    '<div class="ti-num">' + num + '</div>' +
    '<button class="ti-done" title="今日やった">✓</button>';
  row.querySelector(".ti-name").textContent = task.name;
  row.querySelector(".ti-sub").textContent = sub;
  row.onclick = (e) => {
    if (e.target.closest(".ti-done")) { quickDone(task.id); return; }
    openId = task.id; editIntervalFor = null; editNameFor = null; render();

}
let toastTimer = null;
function showToast(msg, undoFn, noteFn) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
  t.innerHTML = '<span></span>' + (noteFn ? '<button data-k="note">✎ メモ</button>' : '') + (undoFn ? '<button data-k="undo">取り消す</button>' : '');
  t.querySelector("span").textContent = msg;
  if (undoFn) t.querySelector('[data-k="undo"]').onclick = () => { undoFn(); t.classList.remove("show"); };
  if (noteFn) t.querySelector('[data-k="note"]').onclick = () => { t.classList.remove("show"); noteFn(); };
  requestAnimationFrame(() => t.classList.add("show"));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), noteFn ? 6000 : 4500);
}
function quickDone(id) {
  const task = tasks.find(x => x.id === id);
  if (!task) return;
  if (task.dates.includes(todayStr())) { showToast("今日はもう記録済みです"); return; }
  const before = { dates: [...task.dates], updatedAt: task.updatedAt };
  markToday(id);
  const today = todayStr();
  showToast("「" + task.name + "」を記録", () => {
    task.dates = before.dates; pruneNotes(task); touch(task); save(); render();
  }, () => editNote(id, today));
}

function buildStoppedRow(task) {
  const row = document.createElement("div");
  row.className = "ti stopped";
  const ds = [...task.dates].sort();
  const parts = [];
  if (task.archivedAt) parts.push("やめた日 " + fmtShort(new Date(task.archivedAt + "T00:00:00")));
  if (ds.length) parts.push("記録 " + ds.length + "回");
  const av = avgInterval(task);
  if (av) parts.push("平均 " + av.avg + "日ごと");
  else if (task.interval) parts.push("目安 " + task.interval + "日");
  row.innerHTML = '<div class="ti-main"><div class="ti-name"></div><div class="ti-sub"></div>' + (task.stopNote ? '<div class="ti-why"></div>' : '') + '</div>' +
    '<button class="ti-resume">再開する</button>';
  row.querySelector(".ti-name").textContent = task.name;
  row.querySelector(".ti-sub").textContent = parts.join(" ・ ") || "記録なし";
  if (task.stopNote) row.querySelector(".ti-why").textContent = "「" + task.stopNote + "」";
  row.onclick = (e) => {
    if (e.target.closest(".ti-resume")) { resumeTask(task.id); return; }
    openHistory(task.id);
  };
  return row;
}
async function stopTask(id) {
  const task = tasks.find(x => x.id === id);
  if (!task) return;
  const why = await askText("「" + task.name + "」をやめた習慣に移します", "", "やめた理由など（空でもOK）。記録はそのまま残り、いつでも再開できます");
  if (why === null) return;
  task.archived = true; task.archivedAt = todayStr(); task.stopNote = why.trim();
  touch(task); save();
  openId = null; render();
  showToast("「" + task.name + "」をやめた習慣に移しました", () => {
    task.archived = false; task.archivedAt = ""; task.stopNote = ""; touch(task); save(); render();
  });
}
function resumeTask(id) {
  const task = tasks.find(x => x.id === id);
  if (!task) return;
  task.archived = false; task.archivedAt = ""; task.stopNote = "";
  touch(task); save();
  activeTab = task.interval ? "tracked" : "simple";
  openId = task.id; render();
  showToast("「" + task.name + "」を再開しました");
}

function startAdd(){ adding = true; addKind = activeTab === "deadline" ? "deadline" : "repeat"; render(); }

function startEditInterval(id){ editIntervalFor = id; render(); const el=document.getElementById("ivInput"+id); if(el){el.focus();el.select();} }

// ── モーダル ──
function closeModal(){ const m = document.getElementById("modalRoot"); if (m) m.remove(); }

function openHistory(id) {
  closeModal();
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  const asc = [...task.dates].sort();
  const rows = asc.map((d, i) => {
    const gap = i > 0 ? Math.round((new Date(d + "T00:00:00") - new Date(asc[i-1] + "T00:00:00")) / 86400000) : null;
    const note = noteOf(task, d);
    return '<div class="history-row"><div style="flex:1;min-width:0"><div>'+fmtDate(d)+'</div>' +
      '<div class="h-sub">'+(gap !== null ? '前回から '+gap+'日' : 'はじめての記録')+'</div>' +
      (note ? '<div class="h-note">'+esc(note)+'</div>' : '') + '</div>' +
      '<span class="ago-tag">'+daysSince(d)+'日前</span>' +
      '<button class="icon-btn" title="メモ" style="color:var(--accent);opacity:.75;font-size:16px" onclick="editNote('+id+',\''+d+'\',true)">✎</button>' +
      '<button class="icon-btn" title="削除" style="color:var(--accent);opacity:.6" onclick="removeDate('+id+',\''+d+'\')">🗑</button></div>';
  }).reverse().join("");
  const av = avgInterval(task);
  const root = document.createElement("div");
  root.id = "modalRoot"; root.className = "overlay";
  root.onclick = (e) => { if (e.target === root) closeModal(); };
  root.innerHTML =
    '<div class="modal">' +
      '<div class="modal-head"><div><div class="kicker">HISTORY</div><div class="modal-title">'+esc(task.name)+'</div></div>' +
      '<button class="icon-btn" onclick="closeModal()">✕</button></div>' +
      '<div>'+rows+'</div>' +
      (task.archived ? '<div class="last-note" style="margin:0 0 10px"><span>やめた日 '+(task.archivedAt ? fmtDate(task.archivedAt) : '')+'</span>'+esc(task.stopNote || '（理由のメモなし）')+'</div>' : '') +
      (av ? '<div class="avg-line" style="margin:0 0 6px">平均 <b>'+av.avg+'日</b>ごと<span class="avg-n">（'+av.n+'回）</span></div>' : '') +
      '<div class="cal-legend" style="margin-top:14px">最新'+MAX_HISTORY+'回分まで保存されます。✎ でその回のメモ</div>' +
    '</div>';
  document.body.appendChild(root);
}

let calView = null;
function openPicker(id) {
  closeModal();
  const now = new Date();
  calView = { id, y: now.getFullYear(), m: now.getMonth() };
  renderPicker();
}
function changeMonth(delta) {
  let m = calView.m + delta, y = calView.y;
  if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
  calView.m = m; calView.y = y; renderPicker();
}
function renderPicker() {
  closeModal();
  const { id, y, m } = calView;
  const task = tasks.find(t => t.id === id);
  const recorded = new Set(task ? task.dates : []);
  const todayKey = todayStr();
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  const startDow = new Date(y, m, 1).getDay();
  const dim = new Date(y, m+1, 0).getDate();
  let cells = "";
  for (let i = 0; i < startDow; i++) cells += "<div></div>";
  for (let d = 1; d <= dim; d++) {
    const key = y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
    const future = new Date(y, m, d) > today;
    const cls = "cal-day" + (key===todayKey?" today":"") + (recorded.has(key)?" recorded":"");
    const dot = recorded.has(key) ? '<span class="cal-dot"></span>' : '';
    cells += '<button class="'+cls+'" '+(future?'disabled':'onclick="markDate('+id+',\''+key+'\')"')+'>'+d+dot+'</button>';
  }
  const dows = ["日","月","火","水","木","金","土"].map((w,i)=>
    '<div class="cal-dow" style="color:'+(i===0?"#c45a5a":i===6?"#5a7fc4":"rgba(42,37,33,.45)")+'">'+w+'</div>').join("");

  const root = document.createElement("div");
  root.id = "modalRoot"; root.className = "overlay";
  root.onclick = (e) => { if (e.target === root) closeModal(); };
  root.innerHTML =
    '<div class="modal">' +
      '<div class="modal-head"><div><div class="kicker">SELECT DATE</div><div class="modal-title">'+esc(task?task.name:"")+'</div></div>' +
      '<button class="icon-btn" onclick="closeModal()">✕</button></div>' +
      '<div class="cal-nav">' +
        '<button class="icon-btn" onclick="changeMonth(-1)" style="font-size:22px">‹</button>' +
        '<div class="cal-month">'+y+'年 '+(m+1)+'月</div>' +
        '<button class="icon-btn" onclick="changeMonth(1)" style="font-size:22px">›</button>' +
      '</div>' +
      '<div class="cal-grid">'+dows+cells+'</div>' +
      '<div class="cal-legend"><span class="legend-box"></span> 記録済み・未来の日付は選べません</div>' +
    '</div>';
  document.body.appendChild(root);
}


// ── iPhoneとMacで共有（GitHub Gist） ──
// 各端末に「gistだけ触れるトークン」を入れておくと、開いたとき・変更したときに、
// 非公開Gistの areday-sync.json と項目ごとに統合（新しく更新した方を採用）して書き戻す
const GIST_KEY = "elapsed_tracker_gist_v1";
const GIST_FILE = "areday-sync.json";
let gistCfg = null;
try { gistCfg = JSON.parse(localStorage.getItem(GIST_KEY) || "null"); } catch (e) {}
let cloudBusy = false, cloudAgain = false, cloudTimer = 0, cloudMsg = "", cloudErr = false, cloudInMerge = false;
function saveGistCfg() { try { if (gistCfg) localStorage.setItem(GIST_KEY, JSON.stringify(gistCfg)); else localStorage.removeItem(GIST_KEY); } catch (e) {} }
async function gh(path, opt = {}) {
  const headers = { Authorization: "Bearer " + gistCfg.token, Accept: "application/vnd.github+json" };
  if (opt.body) headers["Content-Type"] = "application/json";
  const r = await fetch("https://api.github.com" + path, Object.assign({}, opt, { headers, cache: "no-store" }));
  if (!r.ok) throw new Error(r.status === 401 ? "トークンが使えません（期限切れ・打ち間違い）" : r.status === 403 ? "トークンにgistの権限がありません" : r.status === 404 ? "共有データが見つかりません" : "GitHubエラー " + r.status);
  return r.json();
}
const canon = (arr) => JSON.stringify([...arr].sort((x, y) => (x.id < y.id ? -1 : x.id > y.id ? 1 : 0)));
function cloudPayload() { return JSON.stringify({ app: "areday", v: DATA_VERSION, at: Date.now(), tasks }); }
async function findOrCreateGist() {
  for (let p = 1; p <= 5; p++) {
    const list = await gh("/gists?per_page=100&page=" + p);
    const g = list.find((x) => x.files && x.files[GIST_FILE]);
    if (g) return g.id;
    if (list.length < 100) break;
  }
  const g = await gh("/gists", { method: "POST", body: JSON.stringify({ description: "あれから、何日。 iPhoneとMacの共有データ", public: false, files: { [GIST_FILE]: { content: cloudPayload() } } }) });
  return g.id;
}
function cloudSchedule() {
  if (!gistCfg || cloudInMerge) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(cloudSync, 1500);
}
async function cloudSync() {
  if (!gistCfg || !gistCfg.token) return;
  if (cloudBusy) { cloudAgain = true; return; }

    if (f) {

      await gh("/gists/" + gistCfg.id, { method: "PATCH", body: JSON.stringify({ files: { [GIST_FILE]: { content: cloudPayload() } } }) });

<script>
  (function setupViewportTracking() {
    // iPhoneの定石（CLAUDE.md）：アプリ全体を「いま見えている範囲」（キーボードの上）にぴったり重ね、
    // 下から出るシートは --kb ぶん持ち上げる。iPhoneは見える範囲を少しずつ動かすので、入力中は毎フレーム追いかける
    const vv = window.visualViewport; if (!vv) return;
    const root = document.documentElement; let baseH = vv.height, lastH = -1, lastT = -1, lastK = -1;
    function apply() {
      const h = Math.round(vv.height), t = Math.max(0, Math.round(vv.offsetTop));
      const k = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
      if (h !== lastH) { root.style.setProperty('--app-height', h + 'px'); lastH = h; }
      if (t !== lastT) { root.style.setProperty('--app-top', t + 'px'); lastT = t; }
      if (k !== lastK) { root.style.setProperty('--kb', k + 'px'); lastK = k; }
      document.body.classList.toggle('keyboard-open', h < baseH - 120);
    }
    let until = 0, looping = false;
    function follow(ms) {
      until = Math.max(until, performance.now() + ms);
      if (looping) return; looping = true;
      const tick = () => { apply(); const a = document.activeElement; const typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); if (typing || performance.now() < until) requestAnimationFrame(tick); else looping = false; };
      requestAnimationFrame(tick);
    }
    vv.addEventListener('resize', () => follow(600)); vv.addEventListener('scroll', () => follow(600));
    document.addEventListener('focusin', (e) => {
      follow(1200);
      const el = e.target;
      if (!el || !/^(INPUT|TEXTAREA)$/.test(el.tagName) || /^(date|time|month|checkbox|radio|file|range|color)$/.test(el.type)) return;
      // キーボードが出きったあと、入力欄を見える位置へ
      [350, 700].forEach((ms) => setTimeout(() => { if (document.activeElement === el) { try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {} } }, ms));
    });
    document.addEventListener('focusout', () => follow(1200));
    window.addEventListener('orientationchange', () => setTimeout(() => { baseH = vv.height; follow(600); }, 300));
    apply();
  })();
</script>
<script>
/* バックアップのお知らせ：前回から30日たったら、画面の上にそっと出す（×で7日おやすみ） */
(function () {
  var KEYS = ["elapsed_tracker_lastsync_v1", "elapsed_tracker_gist_v1"], OWN = "areday.bkNudge", DAY = 86400000;
  function num(k) { try { var v = localStorage.getItem(k); if (!v) return 0; var n = Number(v); if (n) return n; var o = JSON.parse(v); return (o && (o.at || o.lastAt)) || 0; } catch (e) { return 0; } }
  function last() { var m = 0; KEYS.concat([OWN]).forEach(function (k) { m = Math.max(m, num(k)); }); return m; }
  window.bkNudgeMark = function () { try { localStorage.setItem(OWN, String(Date.now())); } catch (e) {} var el = document.getElementById('bk-nudge'); if (el) el.remove(); };
  function show() {
    var now = Date.now(), first = num(OWN + '.first'), snooze = num(OWN + '.snooze');
    if (!first) { try { localStorage.setItem(OWN + '.first', String(now)); } catch (e) {} first = now; }
    if (snooze && now < snooze) return;
    var t = last(), days = Math.floor((now - (t || first)) / DAY);
    if (days < 30) return;
    var el = document.createElement('div'); el.id = 'bk-nudge';
    el.setAttribute('style', 'position:fixed;left:12px;right:12px;margin:0 auto;width:fit-content;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:8000;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 24px);padding:8px 8px 8px 14px;border-radius:999px;background:rgba(28,28,30,.92);color:#fff;font:600 13px/1.4 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)');
    var msg = t ? ('前回のバックアップから' + days + '日。設定から書き出しておくと安心です') : 'まだバックアップがありません。設定から書き出しておくと安心です';
    el.innerHTML = '<span>💾</span><span style="flex:1">' + msg + '</span><button type="button" aria-label="閉じる" style="flex:none;width:26px;height:26px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:14px;line-height:1;cursor:pointer">×</button>';
    el.querySelector('button').onclick = function () { try { localStorage.setItem(OWN + '.snooze', String(Date.now() + 7 * DAY)); } catch (e) {} el.remove(); };
    document.body.appendChild(el);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(show, 1200); }); else setTimeout(show, 1200);
})();
</script>
